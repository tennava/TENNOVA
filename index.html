<style>
:root{--bg:#07141f;--bg2:#0b1f2e;--panel:#0e2a3e;--panel2:#143650;--line:#1f4560;--text:#f3f8fc;--muted:#97afc0;--accent:#ff7a1f;--accent2:#ffb35c;--on:#1a1206;--soft:rgba(255,122,31,.15);--ok:#2fbf6e;--bad:#ef4d4d;--none:#8795a3;--shadow:0 14px 34px rgba(0,0,0,.32);color-scheme:dark}
body[data-theme=blue]{--bg:#051423;--bg2:#082036;--panel:#0b2a44;--panel2:#123a5c;--line:#1a4a70;--accent:#1f8fff;--accent2:#5fd6ff;--on:#ffffff;--soft:rgba(31,143,255,.16)}
body[data-theme=black]{--bg:#070809;--bg2:#0d0f12;--panel:#14171c;--panel2:#1c2027;--line:#2a2f37;--accent:#d7a84a;--accent2:#f2d58c;--soft:rgba(215,168,74,.14)}
body[data-theme=light]{--bg:#eef3f8;--bg2:#e6edf5;--panel:#ffffff;--panel2:#f7f9fc;--line:#dbe3ec;--text:#0f1c29;--muted:#5b6f82;--accent:#ff7a1f;--accent2:#ffb35c;--soft:rgba(255,122,31,.12);--shadow:0 10px 26px rgba(20,40,60,.08);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 100% -10%,var(--panel2),transparent 60%),var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:0 0 auto}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.brand b{display:block;font-size:17px}
.brand small{color:var(--muted);font-size:11px}
.logo{width:48px;height:48px;border-radius:13px;background:#061127;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);overflow:hidden;flex:0 0 auto}.logo img{width:100%;height:100%;object-fit:cover;display:block}.tn-mark{width:31px;height:31px;display:block}
/* TENNOVA intro */
.splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#173b4e 0%,#081722 48%,#050a0f 100%);color:#fff;transition:opacity .55s ease,visibility .55s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-inner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:splashEnter .8s cubic-bezier(.2,.8,.2,1) both;padding:20px}.splash-logo{width:min(78vw,390px);aspect-ratio:1;border-radius:24px;display:grid;place-items:center;background:#061127;box-shadow:0 18px 55px rgba(0,0,0,.35);overflow:hidden;animation:logoFloat 2s ease-in-out infinite}.splash-logo img{width:100%;height:100%;object-fit:contain;display:block}.splash-title{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:3px;direction:ltr}.splash-sub{font-size:12px;letter-spacing:2px;color:#b8cbd6;direction:ltr}.splash-line{width:52px;height:3px;border-radius:8px;background:linear-gradient(90deg,#ff7a1f,#b7e85a);margin-top:10px;animation:lineGrow 1.4s ease-in-out infinite alternate}@keyframes splashEnter{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes lineGrow{from{width:30px;opacity:.55}to{width:72px;opacity:1}}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.tw{position:relative}
.menu{position:absolute;top:50px;inset-inline-end:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;min-width:200px;box-shadow:var(--shadow);display:none;z-index:30}
.menu.open{display:block}
.swatch-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:start}
.swatch-row:hover{background:var(--soft)}
.swatch-row.on{color:var(--accent);font-weight:700}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.swatch-row.on .sw{outline:2px solid var(--accent);outline-offset:2px}
.swatch-row[data-v=black] .sw{background:#070809!important;border-color:#69717b!important}
.view{display:none}
.view.on{display:block;animation:fade .25s ease-out}
@keyframes fade{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}
.sec-h h2{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:12px}
.page-h{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.page-h h1{font-size:21px;margin:0;flex:1}
.grow{flex:1}
/* slider */
.slider{position:relative;height:216px;border-radius:24px;overflow:hidden;margin:14px 0 16px;box-shadow:var(--shadow);background:#0a1d2c}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;background-size:cover;background-position:center}
.slide.on{opacity:1}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(4,12,20,.78) 0%,rgba(4,12,20,.40) 44%,rgba(4,12,20,.04) 100%)}
[dir=ltr] .slide::after{background:linear-gradient(to right,rgba(4,12,20,.78) 0%,rgba(4,12,20,.40) 44%,rgba(4,12,20,.04) 100%)}
.art-a{background:radial-gradient(circle at 18% 72%,#ffe3a3 0 16px,transparent 17px),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 64px),linear-gradient(135deg,#1f6e4f,#0b3a2a)}
.art-b{background:radial-gradient(circle at 16% 30%,#ffb35c 0 18px,transparent 19px),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 56px),linear-gradient(135deg,#1b3f7a,#0a1d3d)}
.slide-txt{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(58%,390px);padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;z-index:2;text-align:start;padding-bottom:27px;color:#fff;pointer-events:none}
.slide-txt h2{margin:0 0 5px;font-size:clamp(15px,2.1vw,18px);line-height:1.45;font-weight:800;color:#fff;text-shadow:0 2px 9px rgba(0,0,0,.72);max-width:100%;overflow-wrap:anywhere}
.slide-txt p{margin:0;font-size:clamp(10px,1.35vw,12px);line-height:1.65;color:#fff;opacity:1;text-shadow:0 2px 8px rgba(0,0,0,.78);max-width:100%;overflow-wrap:anywhere}
body[data-theme=light] .slide-txt{color:#fff}
body[data-theme=light] .slide::after{background:linear-gradient(to left,rgba(3,12,20,.70) 0%,rgba(3,12,20,.34) 48%,rgba(3,12,20,.02) 100%)}
[dir=ltr] body[data-theme=light] .slide::after{background:linear-gradient(to right,rgba(3,12,20,.70) 0%,rgba(3,12,20,.34) 48%,rgba(3,12,20,.02) 100%)}
.dots{position:absolute;bottom:12px;inset-inline-start:22px;display:flex;gap:6px;z-index:3}
.dots i{width:7px;height:7px;border-radius:6px;background:rgba(255,255,255,.4);transition:width .3s;cursor:pointer}
.dots i.on{background:#fff;width:20px}
/* stats / dashboard */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 12px}
.stat b{display:block;font-size:24px;font-weight:800;margin-bottom:4px}
.stat span{font-size:11px;color:var(--muted)}
.cta{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--on);border-radius:20px;padding:14px 16px;margin:12px 0;text-align:start;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 25%,transparent)}
.cta b{display:block;font-size:15px}
.cta small{font-size:12px;opacity:.85}
.motto{border-radius:18px;padding:14px 16px;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:13px;line-height:1.8;margin-bottom:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:start;padding:14px;min-height:112px}
.qcard b{font-size:14px}
.qcard small{font-size:11px;color:var(--muted)}
.qico{width:38px;height:38px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn-s{background:var(--panel)}
.btn-d{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.acts .btn{flex:0 0 auto}
.fab{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);display:grid;place-items:center;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.sbox{position:relative;flex:1}
.sbox svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sbox input{width:100%;padding:13px 44px 13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);outline:none;padding-inline-start:42px}
.sbox input:focus,.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.fld>label{font-size:12px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);outline:none}
.fld textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pickbtn{display:flex;align-items:center;gap:8px;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);text-align:start;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;background:var(--bg2);cursor:pointer;user-select:none}
.chip:has(input:checked){background:var(--accent);color:var(--on);border-color:transparent;font-weight:700}
.chip input{display:none}
.pill{font-size:11px;padding:5px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.present{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.absent{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.none{background:color-mix(in srgb,var(--none) 20%,transparent);color:var(--none)}
.seg{display:flex;gap:6px}
.seg button{padding:7px 9px;border-radius:10px;border:1px solid var(--line);font-size:12px;background:var(--bg2);white-space:nowrap}
.seg button.on.present{background:var(--ok);color:#06140c;border-color:transparent;font-weight:700}
.seg button.on.absent{background:var(--bad);color:#fff;border-color:transparent;font-weight:700}
.seg button.on.none{background:var(--none);color:#fff;border-color:transparent;font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s}
/* students */
.slist{display:grid;gap:10px}
.s-card{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:start;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.s-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.av{width:52px;height:52px;border-radius:50%;flex:0 0 52px;display:grid;place-items:center;font-weight:800;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--on);border:2px solid var(--line)}
.av.lg{width:86px;height:86px;flex-basis:86px;font-size:28px;border:4px solid var(--panel)}
.av.sm{width:40px;height:40px;flex-basis:40px;font-size:14px}
.s-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.s-info b{font-size:15px}
.s-info small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted)}
[dir=rtl] .chev svg{transform:scaleX(-1)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:13px;line-height:2}
.empty .big{font-size:38px}
/* profile */
.banner{height:150px;border-radius:22px;position:relative;margin-bottom:46px;background:linear-gradient(100deg,rgba(6,19,30,.2),rgba(6,19,30,.55)),url('https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?auto=format&fit=crop&w=1600&q=85') center 55%/cover,linear-gradient(120deg,var(--accent),var(--accent2))}
.banner .av{position:absolute;bottom:-40px;inset-inline-start:18px}
.prof-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prof-head h2{margin:0 0 4px;font-size:20px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.info-box{background:var(--bg2);border-radius:14px;padding:12px;min-width:0}
.info-box small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.info-box strong{font-size:13px;word-break:break-word}
.rate-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
/* schedule */
.days-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 14px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px}
.dbtn small{color:var(--muted);font-size:10px}
.dbtn b{font-size:15px}
.dbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border-color:transparent;font-weight:800}
.dbtn.on small{color:var(--on)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.week-nav .nb{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.sess{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px;box-shadow:var(--shadow)}
.num-badge{width:46px;height:46px;border-radius:15px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:0 0 46px}
.sess .s-info b{font-size:15px}
.sess .s-info small{font-size:12px}
.ico-btn{width:36px;height:36px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.ico-btn.on-ok{background:var(--ok);color:#06140c;border-color:transparent}
/* attendance & reports */
.seg-tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin:10px 0 14px}
.seg-tabs button{flex:1;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-tabs button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on)}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rstat{display:flex;flex-direction:column;gap:6px;padding:14px;min-height:96px}
.rstat b{font-size:22px}
.rstat span{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:stretch;gap:8px;height:220px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.col .pct{font-size:11px;color:var(--muted)}
.colbar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.colbar i{display:block;width:100%;max-width:36px;border-radius:10px 10px 4px 4px;min-height:0;transition:height .4s}
.colbar i.hi{background:var(--ok)}
.colbar i.mid{background:var(--accent)}
.colbar i.low{background:var(--bad)}
.colbar i.none{background:var(--line)}
.col .wd{font-size:11px;color:var(--muted);white-space:nowrap}
/* bottom nav */
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:25;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bnav-in{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:14px;color:var(--muted);font-size:11px}
.bnav button.on{color:var(--accent);background:var(--soft);font-weight:700}
/* modal / picker */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.mh{margin:0 0 14px;font-size:17px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding:6px 0}
.cal button{padding:9px 0;border-radius:11px;font-size:13px}
.cal button.today{outline:1px solid var(--accent)}
.cal button.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);font-weight:800}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#20262e;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;font-size:13px}
.toast.show{opacity:1}
@media(min-width:720px){
 .wrap{padding-top:6px}
 .quick{grid-template-columns:repeat(4,1fr)}
 .slider{height:260px}
 .slide-txt h2{font-size:26px}
}
@media(min-width:860px){.slist{grid-template-columns:1fr 1fr}}
@media(max-width:420px){
 .row2{grid-template-columns:1fr}
 .stat b{font-size:20px}
 .info-grid{grid-template-columns:1fr}
 .slider{height:200px}
 .seg button{padding:6px 7px;font-size:11px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const isoOf=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const msOf=iso=>{const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)};
const wdIdx=iso=>(new Date(msOf(iso)).getUTCDay()+1)%7;
const jLeap=y=>((25*y+11)%33)<8;
const jMLen=(y,m)=>m<=6?31:m<=11?30:(jLeap(y)?30:29);
const JSTART=[0,0];
function jYStart(y){let last=JSTART.length-1;while(last<y){JSTART[last+1]=JSTART[last]+365+(jLeap(last)?1:0);last++}return JSTART[y]}
const jDayIdx=(y,m,d)=>jYStart(y)+(m<=6?31*(m-1):186+30*(m-7))+d-1;
const ANCH_MS=Date.UTC(2025,2,21), ANCH_IDX=jDayIdx(1404,1,1);
const jToIso=(y,m,d)=>isoOf(ANCH_MS+(jDayIdx(y,m,d)-ANCH_IDX)*DAY);
function isoToJ(iso){const idx=ANCH_IDX+(msOf(iso)-ANCH_MS)/DAY;let y=Math.floor(idx/365.2425)+1;while(jYStart(y)>idx)y--;while(jYStart(y+1)<=idx)y++;let rem=idx-jYStart(y),m=1;while(rem>=jMLen(y,m)){rem-=jMLen(y,m);m++}return{y,m,d:rem+1,wd:wdIdx(iso)}}
/*END JALALI*/

function isRec(s,date){return D(s).includes(wdIdx(date))&&(!s.startDate||date>=s.startDate)}
function sessionOn(s,date){
  if(s.skipped&&s.skipped[date])return null;
  if(s.sessions&&s.sessions[date])return{start:s.sessions[date].start||'',end:s.sessions[date].end||'',custom:true};
  if(isRec(s,date))return{start:s.time||'',end:s.endTime||'',custom:false};
  return null;
}
function statusOf(s,date){const v=s.attendance&&s.attendance[date];return v===true?'present':v==='absent'?'absent':'none'}
function setStatus(s,date,st){s.attendance=s.attendance||{};if(st==='present')s.attendance[date]=true;else if(st==='absent')s.attendance[date]='absent';else delete s.attendance[date]}
function pill(st){return `<span class="pill ${st}">${t(ST_KEY[st])}</span>`}
function sessionsOnDate(date){return students.map(s=>({s,ses:sessionOn(s,date)})).filter(x=>x.ses).sort((a,b)=>(a.ses.start||'').localeCompare(b.ses.start||''))}
function periodStats(list,dates){
  const today=todayISO();
  const r={total:0,present:0,absent:0,byDay:Array.from({length:7},()=>({p:0,a:0}))};
  for(const d of dates){const w=wdIdx(d);for(const s of list){if(!sessionOn(s,d))continue;r.total++;const st=statusOf(s,d);if(st==='present'){r.present++;r.byDay[w].p++}else if(st==='absent'&&d<=today){r.absent++;r.byDay[w].a++}}}
  r.recorded=r.present+r.absent;r.pct=r.recorded?Math.round(r.present/r.recorded*100):null;return r;
}
function rateOf(s){const a=s.attendance||{};const today=todayISO();let p=0,ab=0;for(const k in a){if(a[k]===true)p++;else if(a[k]==='absent'&&k<=today)ab++}return{p,ab,pct:(p+ab)?Math.round(p/(p+ab)*100):null}}
function earliestDate(){let e=todayISO();for(const s of students){if(s.startDate&&s.startDate<e)e=s.startDate;for(const k of Object.keys(s.attendance||{}))if(k<e)e=k;for(const k of Object.keys(s.sessions||{}))if(k<e)e=k}return e}
function monthRange(off){const tj=isoToJ(todayISO());const idx=tj.y*12+(tj.m-1)+off;const y=Math.floor(idx/12),m=idx%12+1;return{start:jToIso(y,m,1),end:jToIso(y,m,jMLen(y,m)),y,m}}

function vProfile(){
  const s=stu(ui.sid);if(!s){ui.view='students';return vStudents()}
  const today=todayISO(),wk=weekStart(today);
  const weekN=datesBetween(wk,addDays(wk,6)).filter(d=>sessionOn(s,d)).length;
  const r=rateOf(s);
  return `
  <div class="page-h"><button class="icon-btn" data-a="go" data-v="students" aria-label="${t('back')}">${svg('left',20)}</button><h1>${esc(s.name)}</h1></div>
  <div class="card" style="margin-top:12px;padding-bottom:16px">
    <div class="banner"><span class="av lg">${esc(ini(s.name))}</span></div>
    <div class="prof-head"><div style="flex:1;min-width:0"><h2>${esc(s.name)}</h2>
      <div class="muted">${s.age?N(s.age)+' '+t('years'):''}${s.phone?' · '+N(s.phone):''}</div></div></div>
    <div class="pbtns">
      <a class="btn btn-p" href="${s.phone?'tel:'+esc(s.phone):'#'}" style="text-decoration:none">${svg('phone',18)}${t('call')}</a>
      <button class="btn btn-s" data-a="edit" data-id="${s.id}">${svg('edit',18)}${t('edit')}</button>
    </div>
    <div class="chips">${D(s).length?D(s).map(i=>`<span class="chip" style="cursor:default;background:var(--soft);color:var(--accent);border-color:transparent">${dayName(i)}</span>`).join(''):`<span class="muted">${t('not_set')}</span>`}</div>
    <div class="info-grid">
      <div class="info-box"><small>${t('p_start')}</small><strong>${s.startDate?fmtJ(s.startDate,{wd:true}):t('not_set')}</strong></div>
      <div class="info-box"><small>${t('p_time')}</small><strong>${tmv(s.time)}${s.endTime?' – '+tmv(s.endTime):''}</strong></div>
    </div>
    <div class="info-box"><small>${t('p_notes')}</small><strong>${s.notes?esc(s.notes):t('not_set')}</strong></div>
    <div class="info-box" style="margin-top:10px">
      <div class="rate-line"><span>${t('p_rate')}</span><b>${r.pct==null?'—':N(r.pct)+'%'}</b></div>
      <div class="bar"><i style="width:${r.pct||0}%"></i></div>
      <div class="muted" style="margin-top:6px">${N(r.p)} ${t('st_p')} · ${N(r.ab)} ${t('st_a')} · ${t('p_week')}: ${N(weekN)}</div>
    </div>
    <button class="btn btn-p" data-a="sched" data-id="${s.id}" style="width:100%;margin-top:14px">${svg('cal',18)}${t('p_sessions')}</button>
    <div class="acts"><button class="btn btn-d" data-a="sdel" data-id="${s.id}">${svg('trash',16)}${t('p_del')}</button></div>
  </div>`;
}

function vSchedule(){
  const s=stu(ui.sid);if(!s){ui.view='students';return vStudents()}
  if(!ui.wkStart)ui.wkStart=weekStart(todayISO());
  if(!ui.selDay)ui.selDay=todayISO();
  const days=Array.from({length:7},(_,i)=>addDays(ui.wkStart,i));
  const list=days.filter(d=>sessionOn(s,d));
  const recorded=list.filter(d=>statusOf(s,d)!=='none').length;
  const pct=list.length?Math.round(recorded/list.length*100):0;
  const sel=sessionOn(s,ui.selDay);
  const num=sel?list.indexOf(ui.selDay)+1:0;
  const j1=isoToJ(days[0]),j7=isoToJ(days[6]);
  return `
  <div class="page-h"><button class="icon-btn" data-a="go" data-v="profile" aria-label="${t('back')}">${svg('left',20)}</button>
    <div style="flex:1;min-width:0"><h1 style="font-size:18px">${t('ws_title')}</h1><div class="muted">${esc(s.name)}</div></div></div>
  <div class="card" style="margin-top:12px">
    <div class="week-nav">
      <button class="nb" data-a="wk" data-n="-1" aria-label="prev">${svg('chev',18)}</button>
      <b style="font-size:13px;text-align:center">${fmtJ(days[0])} – ${fmtJ(days[6])}</b>
      <button class="nb" data-a="wk" data-n="1" aria-label="next">${svg('left',18)}</button>
    </div>
    <div class="days-strip">${days.map((d,i)=>`<button class="dbtn ${d===ui.selDay?'on':''}" data-a="selday" data-d="${d}"><small>${dayShort(i)}</small><b>${N(isoToJ(d).d)}</b></button>`).join('')}</div>
    <div class="row2" style="gap:8px">
      <div class="info-box"><small>${t('scheduled')}</small><strong>${N(list.length)}</strong></div>
      <div class="info-box"><small>${t('recorded_l')}</small><strong>${N(recorded)} / ${N(list.length)}</strong></div>
    </div>
    <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <div class="muted" style="margin-top:6px">${t('week')}: ${N(pct)}%</div>
  </div>
  <div class="sec-h"><h2>${fmtJ(ui.selDay,{wd:true})}</h2>
    <button class="btn btn-p" data-a="addsess" style="padding:9px 12px">${svg('plus',16)}${t('add_session')}</button></div>
  ${sel?`
  <div class="sess">
    <span class="num-badge">${N(num)}</span>
    <div class="s-info"><b>${tmv(sel.start)} – ${tmv(sel.end)}</b><small>${t('sess')} ${N(num)} · ${pill(statusOf(s,ui.selDay))}</small></div>
    <div class="seg">
      <button class="ico-btn ${statusOf(s,ui.selDay)==='present'?'on-ok':''}" data-a="st" data-id="${s.id}" data-d="${ui.selDay}" data-st="present" title="${t('st_p')}">${svg('check',16)}</button>
      <button class="ico-btn" data-a="st" data-id="${s.id}" data-d="${ui.selDay}" data-st="absent" title="${t('st_a')}" style="${statusOf(s,ui.selDay)==='absent'?'background:var(--bad);color:#fff;border-color:transparent':''}">${svg('x',16)}</button>
      <button class="ico-btn" data-a="st" data-id="${s.id}" data-d="${ui.selDay}" data-st="none" title="${t('st_n')}">${svg('dash',16)}</button>
    </div>
    <button class="ico-btn" data-a="editsess" data-id="${s.id}" data-d="${ui.selDay}" aria-label="${t('edit')}">${svg('chev',16)}</button>
  </div>`:`<div class="card empty">${t('no_sess')}</div>`}`;
}

function vOverview(){
  if(!ui.ovStart)ui.ovStart=weekStart(todayISO());
  const days=Array.from({length:7},(_,i)=>addDays(ui.ovStart,i));
  const any=days.some(d=>sessionsOnDate(d).length);
  return `
  <div class="page-h"><h1>${t('ws_all')}</h1></div>
  <div class="card" style="margin-top:12px"><div class="week-nav">
    <button class="nb" data-a="ovk" data-n="-1">${svg('chev',18)}</button>
    <b style="font-size:13px">${fmtJ(days[0])} – ${fmtJ(days[6])}</b>
    <button class="nb" data-a="ovk" data-n="1">${svg('left',18)}</button></div></div>
  ${any?days.map(d=>{const items=sessionsOnDate(d);if(!items.length)return '';return `
    <div class="sec-h"><h2>${fmtJ(d,{wd:true})}</h2><span class="muted">${N(items.length)}</span></div>
    <div class="slist">${items.map(x=>`
      <button class="s-card" data-a="sched" data-id="${x.s.id}" data-d="${d}">
        <span class="av sm">${esc(ini(x.s.name))}</span>
        <span class="s-info"><b>${esc(x.s.name)}</b><small>${tmv(x.ses.start)}${x.ses.end?' – '+tmv(x.ses.end):''}</small></span>
        ${pill(statusOf(x.s,d))}</button>`).join('')}</div>`}).join(''):`<div class="card empty">${t('no_ws')}</div>`}`;
}

function vAttendance(){
  if(!ui.attDate)ui.attDate=todayISO();
  const d=ui.attDate;
  const due=sessionsOnDate(d);
  const cnt={present:0,absent:0,none:0};due.forEach(x=>cnt[statusOf(x.s,d)]++);
  return `
  <div class="page-h"><div style="flex:1"><h1>${t('att_title')}</h1><div class="muted">${t('att_sub')}</div></div></div>
  <div class="card" style="margin-top:12px">
    <div class="fld" style="margin:0"><label>${t('date_lbl')}</label>
      <div style="display:flex;gap:8px"><button class="pickbtn" data-a="pickAtt" style="flex:1">${svg('cal',18)}<span>${fmtJ(d,{wd:true})}</span></button>
      <button class="btn btn-s" data-a="attToday">${t('today')}</button></div></div>
    <div class="muted" style="margin-top:10px">${t('att_hint')}</div>
  </div>
  <div class="rstats">
    <div class="card rstat"><b>${N(cnt.present)}</b><span>${t('st_p')}</span></div>
    <div class="card rstat"><b>${N(cnt.absent)}</b><span>${t('st_a')}</span></div>
  </div>
  <div class="sec-h"><h2>${t('att_list')}</h2><span class="muted">${N(due.length)} ${t('years')==='years'?'':''}</span></div>
  ${due.length?`<div class="slist">${due.map(x=>{const st=statusOf(x.s,d);return `
    <div class="s-card" style="cursor:default">
      <span class="av sm">${esc(ini(x.s.name))}</span>
      <span class="s-info"><b>${esc(x.s.name)}</b><small>${tmv(x.ses.start)}${x.ses.end?' – '+tmv(x.ses.end):''}</small></span>
      <div class="seg">
        <button class="${st==='present'?'on present':''}" data-a="ast" data-id="${x.s.id}" data-st="present">${t('st_p')}</button>
        <button class="${st==='absent'?'on absent':''}" data-a="ast" data-id="${x.s.id}" data-st="absent">${t('st_a')}</button>
        <button class="${st==='none'?'on none':''}" data-a="ast" data-id="${x.s.id}" data-st="none">${t('st_n')}</button>
      </div></div>`}).join('')}</div>`:`<div class="card empty">${t('att_empty')}</div>`}`;
}

function vReports(){
  const today=todayISO();
  let dates,label;
  if(ui.rep==='weekly'){const ws=addDays(weekStart(today),7*ui.repOff);dates=datesBetween(ws,addDays(ws,6));label=`${fmtJ(dates[0])} – ${fmtJ(dates[6])}`}
  else if(ui.rep==='monthly'){const m=monthRange(ui.repMo);dates=datesBetween(m.start,m.end);label=`${JM_FA[m.m-1]&&(lang==='fa'?JM_FA:JM_EN)[m.m-1]} ${N(m.y)}`}
  else{dates=datesBetween(earliestDate(),today);label=t('r_upto')}
  const list=ui.repSid==='all'?students:students.filter(s=>s.id===ui.repSid);
  const r=periodStats(list,dates);
  const modes=[['weekly','r_week'],['monthly','r_month'],['alltime','r_all']];
  const bars=r.byDay.map((b,i)=>{const rec=b.p+b.a;const pc=rec?Math.round(b.p/rec*100):null;const cls=pc==null?'none':pc>=75?'hi':pc>=50?'mid':'low';
    return `<div class="col"><span class="pct">${pc==null?'–':N(pc)+'%'}</span><div class="colbar"><i class="${cls}" style="height:${pc==null?4:Math.max(pc,4)}%"></i></div><span class="wd">${dayShort(i)}</span></div>`}).join('');
  return `
  <div class="page-h"><h1>${t('rep_title')}</h1></div>
  <div class="seg-tabs">${modes.map(([k,lk])=>`<button class="${ui.rep===k?'on':''}" data-a="rmode" data-v="${k}">${t(lk)}</button>`).join('')}</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <select data-c="rsid" class="card" style="flex:1;padding:11px;border-radius:14px">
      <option value="all" ${ui.repSid==='all'?'selected':''}>${t('r_all_st')}</option>
      ${students.map(s=>`<option value="${s.id}" ${ui.repSid===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
    </select></div>
  ${ui.rep!=='alltime'?`<div class="week-nav card" style="padding:10px 12px">
    <button class="nb" data-a="rnav" data-n="${ui.rep==='monthly'?-1:-1}">${svg('chev',18)}</button>
    <b style="font-size:13px;text-align:center">${label}</b>
    <button class="nb" data-a="rnav" data-n="1">${svg('left',18)}</button></div>`:`<div class="card" style="padding:10px 12px;text-align:center;font-size:13px">${label}</div>`}
  ${r.total===0?`<div class="card empty" style="margin-top:12px">${t('r_empty')}</div>`:`
  <div class="card" style="margin-top:12px"><div class="sec-h" style="margin:0 0 10px"><h2 style="font-size:15px">${t('r_bar')}</h2></div>
    <div class="chart">${bars}</div></div>
  <div class="rstats">
    <div class="card rstat"><span>${t('r_total')}</span><b>${N(r.total)}</b></div>
    <div class="card rstat"><span>${t('r_rec')}</span><b>${N(r.recorded)}</b></div>
    <div class="card rstat"><span>${t('r_abs')}</span><b style="color:var(--bad)">${N(r.absent)}</b></div>
    <div class="card rstat"><span>${t('r_pct')}</span><b style="color:var(--accent)">${r.pct==null?'—':N(r.pct)+'%'}</b></div>
  </div>`}`;
}

/* ---------- picker & modal ---------- */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="sheet">${html}</div>`;m.classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function openPicker(iso,cb){const j=isoToJ(iso);pk={y:j.y,m:j.m,sel:iso,cb};renderPicker()}
function renderPicker(){
  const {y,m,sel}=pk;const first=jToIso(y,m,1);const lead=isoToJ(first).wd;const n=jMLen(y,m);const td=todayISO();
  const cells=[];for(let i=0;i<lead;i++)cells.push('<span></span>');
  for(let d=1;d<=n;d++){const iso=jToIso(y,m,d);cells.push(`<button data-a="pick" data-d="${iso}" class="${iso===sel?'sel':''} ${iso===td?'today':''}">${N(d)}</button>`)}
  const wds=(lang==='fa'?WD_SHORT_FA:WD_SHORT_EN).map(x=>`<span class="wd">${x}</span>`).join('');
  openModal(`
    <div class="ph"><button class="icon-btn" data-a="pm" data-v="-1" aria-label="prev">${svg('chev',18)}</button>
      <b>${(lang==='fa'?JM_FA:JM_EN)[m-1]} ${N(y)}</b>
      <button class="icon-btn" data-a="pm" data-v="1" aria-label="next">${svg('left',18)}</button></div>
    <div class="cal">${wds}${cells.join('')}</div>
    <div class="acts"><button class="btn btn-s" data-a="ptoday">${t('today')}</button><span class="grow"></span><button class="btn btn-s" data-a="mclose">${t('cancel')}</button></div>`);
}
function sessionModal(sid,date){
  const s=stu(sid);if(!s)return;
  const cur=sessionOn(s,date);const v=cur||{start:s.time||'',end:s.endTime||''};
  openModal(`<h3 class="mh">${t(cur?'sess_edit':'sess_new')}</h3>
  <form id="sessForm" data-id="${sid}" data-d="${date}">
    <div class="fld"><label>${t('date')}</label>
      <button type="button" class="pickbtn" data-a="pickSess" data-id="${sid}" data-d="${date}">${svg('cal',18)}<span>${fmtJ(date,{wd:true})}</span></button></div>
    <div class="row2">
      <div class="fld"><label>${t('start')}</label><input type="time" name="start" value="${esc(v.start)}" required></div>
      <div class="fld"><label>${t('end')}</label><input type="time" name="end" value="${esc(v.end)}"></div>
    </div>
    <div class="acts">${cur?`<button type="button" class="btn btn-d" data-a="sessDel" data-id="${sid}" data-d="${date}">${svg('trash',16)}${t('delete')}</button>`:''}
      <span class="grow"></span><button type="button" class="btn btn-s" data-a="mclose">${t('cancel')}</button><button class="btn btn-p" type="submit">${t('save')}</button></div>
  </form>`);
}

/* ---------- app shell ---------- */
const VIEWS={home:vHome,students:vStudents,form:vForm,profile:vProfile,schedule:vSchedule,overview:vOverview,attendance:vAttendance,reports:vReports,settings:vSettings};
const NAV=[['home','home','n_home'],['students','users','n_students'],['attendance','cal','n_att'],['reports','chart','n_rep'],['settings','gear','n_set']];
const NAV_OF={home:'home',overview:'home',students:'students',profile:'students',form:'students',schedule:'students',attendance:'attendance',reports:'reports',settings:'settings'};

function applyDir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.body.dataset.theme=theme}
function renderTop(){
  document.getElementById('brandName').textContent=t('app');
  document.getElementById('brandSub').textContent=t('tagline');
  document.getElementById('themeBtn').innerHTML=svg(theme==='light'?'moon':'sun',20);
  document.getElementById('themeBtn').setAttribute('aria-label',t('theme'));
  document.getElementById('tmenu').innerHTML=THEMES.map(([k,c])=>`<button class="swatch-row ${theme===k?'on':''}" data-a="theme" data-v="${k}"><span class="sw" style="background:${c}"></span>${t('th_'+k)}</button>`).join('');
}
function renderNav(){
  const act=NAV_OF[ui.view];
  document.getElementById('bnav').innerHTML=NAV.map(([v,ic,k])=>`<button data-a="go" data-v="${v}" class="${act===v?'on':''}">${svg(ic,22)}<span>${t(k)}</span></button>`).join('');
}
function render(){
  applyDir();
  const main=document.getElementById('main');
  const fn=VIEWS[ui.view]||vHome;
  main.innerHTML=`<section class="view on">${fn()}</section>`;
  if(ui.view==='students')renderStudentList();
  renderTop();renderNav();
}
function go(v){ui.view=v;if(v!=='form')ui.draft=null;window.scrollTo({top:0,behavior:'instant'});render()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1600)}

/* ---------- student / session logic ---------- */
function saveStudentForm(f){
  const v=readForm(f);
  if(!v.name){toast(t('name_req'));return}
  const obj={name:v.name,age:v.age,phone:v.phone,startDate:v.startDate,time:v.time,endTime:v.endTime,days:v.days,notes:v.notes};
  if(ui.editId){
    const i=students.findIndex(x=>x.id===ui.editId);
    if(i>=0)students[i]={...students[i],...obj};
    save();ui.sid=ui.editId;
  }else{
    const id=String(Date.now());
    students.unshift({id,...obj,attendance:{},sessions:{},skipped:{}});
    save();ui.sid=null;
  }
  ui.editId=null;ui.draft=null;
  toast(t('saved'));
  go(ui.sid?'profile':'students');
}
function saveSession(f){
  const s=stu(f.dataset.id);if(!s)return;
  const d=f.dataset.d,start=f.elements.start.value,end=f.elements.end.value;
  if(!start){toast(t('time_req'));return}
  s.sessions=s.sessions||{};s.skipped=s.skipped||{};
  delete s.skipped[d];
  s.sessions[d]={start,end};
  save();closeModal();toast(t('saved'));render();
}
function deleteSession(sid,d){
  const s=stu(sid);if(!s)return;
  if(s.sessions)delete s.sessions[d];
  if(isRec(s,d)){s.skipped=s.skipped||{};s.skipped[d]=true}
  save();
}

/* ---------- actions ---------- */
const A={
  go:el=>go(el.dataset.v),
  open:el=>{ui.sid=el.dataset.id;go('profile')},
  add:()=>{ui.editId=null;ui.draft=null;go('form')},
  edit:el=>{ui.editId=el.dataset.id;ui.draft=null;go('form')},
  sdel:el=>{
    if(!confirm(t('confirm_del_student')))return;
    students=students.filter(x=>x.id!==el.dataset.id);save();ui.sid=null;toast(t('deleted'));go('students');
  },
  pickForm:()=>{
    const f=document.getElementById('stuForm');
    if(f)ui.draft=readForm(f);
    openPicker(ui.draft?.startDate||todayISO(),iso=>{ui.draft={...(ui.draft||{}),startDate:iso};closeModal();render()});
  },
  sched:el=>{
    ui.sid=el.dataset.id;
    if(el.dataset.d){ui.selDay=el.dataset.d;ui.wkStart=weekStart(el.dataset.d)}
    else{ui.wkStart=weekStart(todayISO());ui.selDay=todayISO()}
    go('schedule');
  },
  wk:el=>{const n=+el.dataset.n;ui.wkStart=addDays(ui.wkStart,7*n);ui.selDay=addDays(ui.selDay,7*n);render()},
  ovk:el=>{ui.ovStart=addDays(ui.ovStart||weekStart(todayISO()),7*(+el.dataset.n));render()},
  selday:el=>{ui.selDay=el.dataset.d;render()},
  addsess:()=>sessionModal(ui.sid,ui.selDay),
  editsess:el=>sessionModal(el.dataset.id,el.dataset.d),
  pickSess:el=>openPicker(el.dataset.d,iso=>sessionModal(el.dataset.id,iso)),
  sessDel:el=>{if(!confirm(t('confirm_del_session')))return;deleteSession(el.dataset.id,el.dataset.d);closeModal();toast(t('deleted'));render()},
  st:el=>{const s=stu(el.dataset.id);if(!s)return;setStatus(s,el.dataset.d,el.dataset.st);save();render()},
  pickAtt:()=>openPicker(ui.attDate||todayISO(),iso=>{ui.attDate=iso;closeModal();render()}),
  attToday:()=>{ui.attDate=todayISO();render()},
  ast:el=>{const s=stu(el.dataset.id);if(!s)return;setStatus(s,ui.attDate,el.dataset.st);save();render()},
  rmode:el=>{ui.rep=el.dataset.v;ui.repOff=0;ui.repMo=0;render()},
  rnav:el=>{if(ui.rep==='monthly')ui.repMo+=+el.dataset.n;else ui.repOff+=+el.dataset.n;render()},
  slide:el=>{ui.slide=+el.dataset.i;applySlides()},
  tmenu:()=>document.getElementById('tmenu').classList.toggle('open'),
  theme:el=>{theme=el.dataset.v;localStorage.setItem(THEME_KEY,theme);document.getElementById('tmenu').classList.remove('open');render();toast(t('saved'))},
  imp:()=>document.getElementById('importFile').click(),
  exp:()=>{
    const blob=new Blob([JSON.stringify({version:1,students},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tennova-backup.json';a.click();URL.revokeObjectURL(a.href);
    toast(t('exported'));
  },
  pm:el=>{pk.m+=+el.dataset.v;if(pk.m<1){pk.m=12;pk.y--}if(pk.m>12){pk.m=1;pk.y++}renderPicker()},
  pick:el=>{pk.cb(el.dataset.d)},
  ptoday:()=>{pk.cb(todayISO())},
  mclose:()=>closeModal()
};
const C={
  lang:el=>{lang=el.value;localStorage.setItem(LANG_KEY,lang);render()},
  rsid:el=>{ui.repSid=el.value;render()}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){A[el.dataset.a](el,e);return}
  if(e.target.id==='modal'){closeModal();return}
  if(!e.target.closest('.tw'))document.getElementById('tmenu').classList.remove('open');
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;renderStudentList()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(txt=>{
      try{
        const data=JSON.parse(txt);const incoming=Array.isArray(data)?data:data.students;
        if(!Array.isArray(incoming))throw new Error('bad');
        if(confirm(t('import_q'))){students=incoming;save();toast(t('imported'));render()}
      }catch(err){alert(t('import_bad'))}
      e.target.value='';
    });
    return;
  }
  const c=e.target.dataset&&e.target.dataset.c;
  if(c&&C[c])C[c](e.target);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='stuForm')saveStudentForm(e.target);
  else if(e.target.id==='sessForm')saveSession(e.target);
});

function applySlides(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===ui.slide));
  document.querySelectorAll('.dots i').forEach((el,i)=>el.classList.toggle('on',i===ui.slide));
}
setInterval(()=>{
  if(ui.view!=='home')return;
  const n=document.querySelectorAll('.slide').length;if(!n)return;
  ui.slide=(ui.slide+1)%n;applySlides();
},5000);

/* ---------- init ---------- */
applyDir();
render();
// Brief branded intro animation; the app remains usable if motion is reduced.
window.addEventListener('load',()=>{const splash=document.getElementById('splash');if(splash)setTimeout(()=>splash.classList.add('hide'),2100)});
setTimeout(()=>{const splash=document.getElementById('splash');if(splash)splash.classList.add('hide')},3500);
</script>
